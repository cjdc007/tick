<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tick: chore planner</title>
<meta name="theme-color" content="#3D4DFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tick">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#151726; --muted:#666A82; --line:#E0E2EC; --line-strong:#C3C6D6;
  --accent:#3D4DFF; --on-accent:#FFFFFF; --mint:#17B890; --on-mint:#FFFFFF; --sun:#FFC533; --coral:#E9344C;
  --coral-soft:#FFE6EA; --accent-soft:#E6E8FF; --mint-soft:#D9F5EC;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1018; --surface:#1A1C29; --ink:#F1F2F8; --muted:#9A9EB8; --line:#2B2E42; --line-strong:#454965;
    --accent:#7C88FF; --on-accent:#10112A; --mint:#2ED3A8; --on-mint:#06241C; --coral:#FF6F82;
    --coral-soft:#3A1B24; --accent-soft:#23264A; --mint-soft:#12342B;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1018; --surface:#1A1C29; --ink:#F1F2F8; --muted:#9A9EB8; --line:#2B2E42; --line-strong:#454965;
  --accent:#7C88FF; --on-accent:#10112A; --mint:#2ED3A8; --on-mint:#06241C; --coral:#FF6F82;
  --coral-soft:#3A1B24; --accent-soft:#23264A; --mint-soft:#12342B;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;overflow:hidden;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:22px 18px 0;height:100%;display:flex;flex-direction:column}
.app>*{flex:none}
#list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:130px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:6px}
.date{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.02;letter-spacing:-.02em;margin:0}
.sub{margin:8px 0 0;color:var(--muted);font-size:16px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.sound{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 14px;font-size:14px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{width:100%;height:100%}
.ring .track{fill:none;stroke:var(--line);stroke-width:9}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;stroke-dasharray:213.63;stroke-dashoffset:213.63;transition:stroke-dashoffset .7s cubic-bezier(.3,1.2,.4,1),stroke .3s}
.ring.full .prog{stroke:var(--mint)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.chips{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip b{font-family:var(--display);font-weight:800}

/* tabs */
.tabs{display:flex;gap:6px;margin:20px 0 6px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:999px}
.tab{flex:1;border:0;background:none;border-radius:999px;height:40px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* list */
ul{list-style:none;margin:0;padding:0}
.group{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);margin:20px 4px 10px}
.item{display:grid;grid-template-rows:1fr;transition:grid-template-rows .36s ease,opacity .3s ease}
.item.leaving{grid-template-rows:0fr;opacity:0}
.inner{overflow:hidden;min-height:0}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 10px 11px 11px;margin-bottom:10px;position:relative}
.row.late{border-left:5px solid var(--coral)}
.body{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.title{font-weight:600;font-size:17px;line-height:1.25;word-break:break-word}
.title span{background:linear-gradient(currentColor,currentColor) 0 58%/0% 2px no-repeat;transition:background-size .35s ease .1s,color .3s ease .1s}
.row.celebrate .title span{background-size:100% 2px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:14px;color:var(--muted);align-items:center}
.meta .time{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}
.tag{border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600}
.tag.rep{background:var(--accent-soft);color:var(--accent)}
.tag.late{background:var(--coral-soft);color:var(--coral)}
.tag.soon{background:var(--mint-soft);color:var(--mint)}
.edit{border:0;background:none;width:40px;height:40px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:none}
.edit svg{width:18px;height:18px}

/* the check */
.check{width:48px;height:48px;border:0;background:none;padding:0;flex:none;position:relative;-webkit-tap-highlight-color:transparent}
.check svg{width:100%;height:100%;overflow:visible}
.check .ringc{fill:none;stroke:var(--line-strong);stroke-width:2.5;transition:stroke .2s}
.check:hover .ringc{stroke:var(--mint)}
.check .fill{fill:var(--mint);transform:scale(0);transform-box:fill-box;transform-origin:center}
.check .tick{fill:none;stroke:var(--on-mint);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:31;stroke-dashoffset:31}
.check::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--mint);opacity:0;pointer-events:none}
.row.celebrate .check{animation:squish .55s ease}
.row.celebrate .fill{animation:fillpop .45s cubic-bezier(.2,1.7,.4,1) forwards}
.row.celebrate .tick{animation:draw .3s .14s ease-out forwards}
.row.celebrate .check::after{animation:shock .6s ease-out}
@keyframes squish{0%{transform:scale(1)}25%{transform:scale(.8)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes fillpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shock{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.3);opacity:0}}

/* portrait only: installed Android apps honour the manifest; iOS doesn't, so cover the app in landscape */
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  .rotate{position:fixed;inset:0;z-index:100;display:grid;place-content:center;gap:8px;text-align:center;background:var(--bg);color:var(--ink);padding:20px}
  .rotate strong{font-family:var(--display);font-weight:800;font-size:24px}
  .rotate span{color:var(--muted)}
}

/* empty */
.empty{text-align:center;padding:44px 10px 10px}
.empty h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:32ch}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500}
.done-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.done-row .t{font-weight:500}.done-row .w{color:var(--muted);font-size:13px}
.done-row .p{font-family:var(--display);font-weight:800;color:var(--mint);margin-left:auto}
.done-row .rm{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;height:34px;min-width:34px;padding:0 10px;font-size:14px;font-weight:600}
.done-row .rm.armed{color:var(--coral);border-color:var(--coral)}

/* buttons */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));height:56px;padding:0 26px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 28px -10px rgba(61,77,255,.65);z-index:20}
.fab:active{transform:translateX(-50%) scale(.97)}
.btn{height:50px;border-radius:14px;border:0;font-weight:600;font-size:16px;padding:0 20px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;color:var(--coral);border:1px solid var(--coral-soft)}

/* sheet */
.wrap{position:fixed;inset:0;z-index:40;display:none}
.wrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,10,25,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.wrap.open .sheet{transform:none}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
.grab{touch-action:none;cursor:grab;margin:-20px -20px 14px;padding:10px 20px 12px;user-select:none;-webkit-user-select:none}
.grab::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 12px}
.sheet.dragging{transition:none}
.scrim{transition:opacity .3s}
.fld{margin-bottom:14px}
.fld>label,.fld>.lab{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.in{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
/* iOS Safari gives date/time inputs an intrinsic width and ignores width:100%; strip native styling so they fit the grid */
.two .in{display:block;min-width:0;max-width:100%;width:100%;height:50px;line-height:48px;-webkit-appearance:none;appearance:none;text-align:center;padding:0 8px}
.two .in::-webkit-date-and-time-value{text-align:center;margin:0;min-width:0;height:48px;line-height:48px}
.two .in::-webkit-datetime-edit{line-height:48px;padding:0}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;overflow:hidden}
.seg button{flex:1;min-width:0;height:42px;border:0;background:none;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.every{display:flex;align-items:center;gap:10px;margin-top:10px}
.every .in{width:84px;text-align:center}
.every select{flex:1}
.err{color:var(--coral);font-size:14px;min-height:20px;margin:0 0 8px}
.acts{display:flex;gap:10px;margin-top:6px}
.acts .primary{flex:1}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* alerts, toast, float */
.alerts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;gap:8px;padding:0 12px;pointer-events:none;align-items:center}
.alert{pointer-events:auto;width:100%;max-width:536px;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;animation:drop .4s cubic-bezier(.2,1.4,.4,1);border-left:6px solid var(--sun)}
.alert .a-ico{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#151726;display:grid;place-items:center;animation:ring 1s ease .2s 2}
.alert .a-ico svg{width:18px;height:18px}
.alert strong{display:block;font-size:17px;font-family:var(--display);font-weight:800;line-height:1.2}
.alert .a-body span{font-size:14px;opacity:.75}
.alert .a-x{background:none;border:0;font-size:24px;line-height:1;width:32px;height:32px;opacity:.7}
.alert .a-act{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.alert .a-act button{flex:1;height:42px;border-radius:12px;border:0;font-weight:600}
.alert [data-a="done"]{background:var(--mint);color:var(--on-mint)}
.alert [data-a="snooze"]{background:rgba(127,127,150,.28);color:var(--bg)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;font-weight:500;z-index:30;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:rgba(127,127,150,.3);color:var(--bg);border-radius:999px;height:34px;padding:0 14px;font-weight:600}
.float{position:fixed;z-index:70;pointer-events:none;font-family:var(--display);font-weight:800;font-size:26px;color:var(--mint);text-align:center;transform:translate(-50%,-50%);animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 var(--bg),0 -2px 0 var(--bg),2px 0 0 var(--bg),-2px 0 0 var(--bg)}
.float small{display:block;font-size:14px;color:var(--sun)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="rotate" role="alert"><strong>Please rotate your phone</strong><span>Tick works in portrait.</span></div>
<div class="alerts" id="alerts" aria-live="assertive"></div>

<main class="app">
  <div class="top">
    <span class="brand">Tick</span>
    <button class="sound" id="soundBtn" aria-label="Toggle sound">Sound on</button>
  </div>
  <section class="hello">
    <div>
      <h1 class="date" id="dateText"></h1>
      <p class="sub" id="subText"></p>
    </div>
    <div class="ring" id="ring" role="img" aria-label="Today's progress">
      <svg viewBox="0 0 88 88"><circle class="track" cx="44" cy="44" r="34"/><circle class="prog" id="prog" cx="44" cy="44" r="34" transform="rotate(-90 44 44)"/></svg>
      <div class="num" id="ringNum">0</div>
    </div>
  </section>
  <div class="chips">
    <span class="chip" id="streakChip"></span>
    <span class="chip" id="pointsChip"></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true" id="tabToday">Today</button>
    <button class="tab" role="tab" data-tab="soon" aria-selected="false">Coming up</button>
    <button class="tab" role="tab" data-tab="done" aria-selected="false">Done</button>
  </div>
  <div id="list"></div>
</main>

<button class="fab" id="fab"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M10 3v14M3 10h14"/></svg>Add chore</button>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<div class="wrap" id="wrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
    <div class="grab" id="grab"><h2 id="sheetTitle">New chore</h2></div>
    <div class="fld"><label for="fTitle">What needs doing?</label><input class="in" id="fTitle" maxlength="80" placeholder="Wash the dishes" autocomplete="off"></div>
    <div class="fld">
      <span class="lab">When</span>
      <div class="two"><input class="in" type="date" id="fDate" aria-label="Date"><input class="in" type="time" id="fTime" aria-label="Time"></div>
      <div class="quick"><button type="button" id="qToday">Today</button><button type="button" id="qTomorrow">Tomorrow</button></div>
    </div>
    <div class="fld">
      <span class="lab">How often</span>
      <div class="seg"><button type="button" id="mOnce" aria-pressed="true">Just once</button><button type="button" id="mRepeat" aria-pressed="false">Repeats</button></div>
      <div class="every" id="everyRow" hidden>
        <span>Every</span>
        <input class="in" type="number" id="fEvery" min="1" max="99" value="1" inputmode="numeric" aria-label="Interval">
        <select class="in" id="fUnit" aria-label="Unit"><option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option></select>
      </div>
    </div>
    <div class="fld"><label for="fRemind">Alert me</label>
      <select class="in" id="fRemind"><option value="0">At the time</option><option value="5">5 minutes before</option><option value="10" selected>10 minutes before</option><option value="30">30 minutes before</option><option value="60">1 hour before</option></select>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="acts"><button class="btn danger" id="delBtn" hidden>Delete</button><button class="btn primary" id="saveBtn">Save chore</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var KEY='tick:v1', memory=null;
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return memory?JSON.parse(memory):null}
var state=Object.assign({chores:[],log:[],stats:{points:0,streak:0,lastDay:null},sound:true},load()||{});
function save(){var s=JSON.stringify(state);memory=s;try{localStorage.setItem(KEY,s)}catch(e){}}
var uid=function(){return Math.random().toString(36).slice(2,9)};
var tab='today', busy=new Set(), combo=0, lastCheck=0, lastUndo=null, undoTimer=0;

/* ---------- dates ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var todayISO=function(){return iso(new Date())};
var dt=function(c){return new Date(c.due+'T'+c.time)};
function addInterval(s,n,unit,anchor){
  var d=parse(s);
  if(unit==='days')d.setDate(d.getDate()+n);
  else if(unit==='weeks')d.setDate(d.getDate()+7*n);
  else{var day=anchor||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim))}
  return iso(d);
}
function dayLabel(s){
  var diff=Math.round((parse(s)-parse(todayISO()))/864e5);
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';
  return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
var timeLabel=function(c){return dt(c).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
function span(m){return m<60?m+' min':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'}
function repeatLabel(r){if(!r)return'';var u={days:'day',weeks:'week',months:'month'}[r.unit];return r.every===1?'Every '+u:'Every '+r.every+' '+u+'s'}
function rel(c){
  var diff=Math.round((dt(c)-Date.now())/60000);
  if(diff<0)return{cls:'late',text:'Overdue '+span(-diff)};
  if(diff<=60)return{cls:'soon',text:diff<=1?'Due now':'In '+diff+' min'};
  return null;
}
var byTime=function(a,b){return dt(a)-dt(b)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ---------- sound ---------- */
var ac=null;
function ctx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,dur,type,vol){
  var a=ctx();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
var SCALE=[0,2,4,7,9,12,14,16];
function sfxCheck(c){if(!state.sound)return;var f=523.25*Math.pow(2,SCALE[Math.min(c,SCALE.length-1)]/12);tone(f,0,.2,'triangle',.2);tone(f*1.5,.07,.26,'sine',.14);tone(f*2,.14,.32,'sine',.08)}
function sfxFanfare(){if(!state.sound)return;[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,i*.09,.45,'triangle',.18)})}
function sfxAlert(){if(!state.sound)return;tone(880,0,.25,'sine',.2);tone(1174.7,.18,.45,'sine',.2)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- confetti ---------- */
var cv=$('#confetti'),cc=cv.getContext('2d'),parts=[],raf=0,W=0,H=0;
var COLORS=['#FFC533','#FF5A6E','#3D4DFF','#17B890','#FF8A3D','#B26BFF'];
function size(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cc.setTransform(d,0,0,d,0,0)}
function rc(){return COLORS[Math.floor(Math.random()*COLORS.length)]}
function burst(x,y,n){
  n=reduced?6:(n||38);
  for(var i=0;i<n;i++){var a=Math.random()*6.283,s=4+Math.random()*8;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,g:.34,w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:rc(),life:0,max:60+Math.random()*40,circ:Math.random()<.3})}
  if(!raf)loop();
}
function rain(){
  if(reduced)return;
  for(var i=0;i<140;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,g:.07,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:rc(),life:0,max:210,circ:Math.random()<.25});
  if(!raf)loop();
}
function loop(){
  cc.clearRect(0,0,W,H);
  parts=parts.filter(function(p){return p.life<p.max&&p.y<H+30});
  parts.forEach(function(p){
    p.vx*=.985;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cc.globalAlpha=1-Math.max(0,(p.life-p.max*.6)/(p.max*.4));
    cc.fillStyle=p.c;cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);
    if(p.circ){cc.beginPath();cc.arc(0,0,p.w/2,0,6.283);cc.fill()}else cc.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cc.restore();
  });
  cc.globalAlpha=1;
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cc.clearRect(0,0,W,H)}
}
size();addEventListener('resize',size);

/* ---------- render ---------- */
function doneToday(){var t=todayISO();return state.log.filter(function(l){return iso(new Date(l.at))===t}).length}
function todayList(){var t=todayISO();return state.chores.filter(function(c){return c.due<=t}).sort(byTime)}
function renderHeader(){
  var t=todayISO(),rem=todayList().length,done=doneToday(),total=rem+done;
  $('#dateText').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  $('#subText').textContent=rem>0?rem+(rem===1?' chore':' chores')+' left today':total>0?'All done for today':'Nothing due today';
  $('#prog').style.strokeDashoffset=213.63*(1-(total?done/total:0));
  $('#ring').classList.toggle('full',total>0&&rem===0);
  $('#ringNum').textContent=total?done+'/'+total:'0';
  var y=new Date();y.setDate(y.getDate()-1);
  var live=(state.stats.lastDay===t||state.stats.lastDay===iso(y))?state.stats.streak:0;
  $('#streakChip').innerHTML='🔥 <b>'+live+'</b> day streak';
  $('#pointsChip').innerHTML='★ <b>'+state.stats.points+'</b> pts, level '+(Math.floor(state.stats.points/100)+1);
  $('#tabToday').textContent='Today'+(rem?' ('+rem+')':'');
  $('#soundBtn').textContent=state.sound?'Sound on':'Sound off';
}
var CHECK='<button class="check" aria-label="Mark done"><svg viewBox="0 0 48 48"><circle class="fill" cx="24" cy="24" r="22"/><circle class="ringc" cx="24" cy="24" r="21"/><path class="tick" d="M14 25l7 7 13-15"/></svg></button>';
var PENCIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
function row(c,showDay){
  var r=rel(c),late=r&&r.cls==='late';
  var m='<span class="time">'+(showDay&&c.due<todayISO()?esc(dayLabel(c.due))+', ':'')+esc(timeLabel(c))+'</span>';
  if(r)m+='<span class="tag '+r.cls+'">'+r.text+'</span>';
  if(c.repeat)m+='<span class="tag rep">↻ '+repeatLabel(c.repeat)+'</span>';
  return '<li class="item" data-id="'+c.id+'"><div class="inner"><div class="row'+(late?' late':'')+'">'+CHECK+
    '<div class="body"><div class="title"><span>'+esc(c.title)+'</span></div><div class="meta">'+m+'</div></div>'+
    '<button class="edit" aria-label="Edit '+esc(c.title)+'">'+PENCIL+'</button></div></div></li>';
}
function renderList(){
  var t=todayISO(),h='';
  if(tab==='today'){
    var items=todayList();
    if(!items.length){
      if(!state.chores.length&&!state.log.length){
        h='<div class="empty"><h2>Your list is empty</h2><p>Add your first chore, pick a time, and Tick will nudge you when it\'s due.</p><div class="sugg">'+
          ['Wash the dishes','Do laundry','Take out the trash','Water the plants','Vacuum'].map(function(s){return'<button data-sugg="'+s+'">'+s+'</button>'}).join('')+'</div></div>';
      }else if(doneToday()>0){
        h='<div class="empty"><h2>All clear. Nice work.</h2><p>You finished '+doneToday()+(doneToday()===1?' chore':' chores')+' today. Enjoy the rest of your day.</p></div>';
      }else{
        h='<div class="empty"><h2>Nothing due today</h2><p>Check Coming up to see what\'s next, or add a new chore.</p></div>';
      }
    }else{
      var over=items.filter(function(c){return c.due<t}),now=items.filter(function(c){return c.due===t});
      if(over.length)h+='<h2 class="group">Overdue</h2><ul>'+over.map(function(c){return row(c,true)}).join('')+'</ul>';
      if(now.length)h+=(over.length?'<h2 class="group">Today</h2>':'<div style="height:10px"></div>')+'<ul>'+now.map(function(c){return row(c,false)}).join('')+'</ul>';
    }
  }else if(tab==='soon'){
    var up=state.chores.filter(function(c){return c.due>t}).sort(byTime);
    if(!up.length)h='<div class="empty"><h2>Nothing scheduled ahead</h2><p>Chores with a later date show up here.</p></div>';
    else{var last='';up.forEach(function(c){if(c.due!==last){if(last)h+='</ul>';h+='<h2 class="group">'+esc(dayLabel(c.due))+'</h2><ul>';last=c.due}h+=row(c,false)});h+='</ul>'}
  }else{
    if(!state.log.length)h='<div class="empty"><h2>Nothing done yet</h2><p>Chores you check off appear here.</p></div>';
    else h='<div style="height:12px"></div>'+state.log.map(function(l){
      var d=new Date(l.at),when=(iso(d)===todayISO()?'Today':d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}))+', '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      return'<div class="done-row"><div><div class="t">'+esc(l.title)+'</div><div class="w">'+when+'</div></div><span class="p">+'+l.pts+'</span><button class="rm" data-rm="'+l.id+'" aria-label="Remove '+esc(l.title)+' from history">×</button></div>'}).join('');
  }
  $('#list').innerHTML=h;
}
function renderAll(){renderHeader();renderList()}

/* ---------- completing ---------- */
function complete(id,btn){
  if(busy.has(id))return;
  var c=state.chores.find(function(x){return x.id===id});if(!c)return;
  busy.add(id);
  var now=Date.now();combo=(now-lastCheck<6000)?combo+1:0;lastCheck=now;
  var snap={chore:JSON.parse(JSON.stringify(c)),stats:Object.assign({},state.stats),logId:null};
  var pts=10+Math.min(combo,5)*2;
  var t=todayISO(),y=new Date();y.setDate(y.getDate()-1);
  if(state.stats.lastDay!==t){state.stats.streak=(state.stats.lastDay===iso(y))?state.stats.streak+1:1;state.stats.lastDay=t}
  state.stats.points+=pts;
  var entry={id:uid(),title:c.title,at:now,pts:pts};snap.logId=entry.id;
  state.log.unshift(entry);state.log=state.log.slice(0,60);
  if(c.repeat){
    var nd=addInterval(c.due,c.repeat.every,c.repeat.unit,c.anchorDay);
    while(nd<=t)nd=addInterval(nd,c.repeat.every,c.repeat.unit,c.anchorDay);
    c.due=nd;c.alertedFor=null;c.snoozeUntil=null;
  }else state.chores=state.chores.filter(function(x){return x.id!==id});
  save();dismissAlert(id);
  var li=document.querySelector('.item[data-id="'+id+'"]'),r=btn.getBoundingClientRect();
  var x=r.left+r.width/2,yy=r.top+r.height/2;
  if(li)li.querySelector('.row').classList.add('celebrate');
  sfxCheck(combo);buzz(25);burst(x,yy);
  var f=document.createElement('div');f.className='float';f.style.left=x+'px';f.style.top=(yy-20)+'px';
  f.innerHTML='+'+pts+(combo>0?'<small>Combo x'+(combo+1)+'</small>':'');document.body.appendChild(f);setTimeout(function(){f.remove()},1000);
  renderHeader();
  setTimeout(function(){
    if(li)li.classList.add('leaving');
    setTimeout(function(){busy.delete(id);renderList()},li?380:0);
  },li?680:0);
  showUndo(snap,c.title);
  if(todayList().length===0&&tab==='today'){setTimeout(function(){sfxFanfare();rain();buzz([40,60,40,60,120])},650)}
}
function showUndo(snap,title){
  lastUndo=snap;$('#toastMsg').textContent='Done: '+(title.length>22?title.slice(0,21)+'…':title);
  $('#toast').classList.add('show');clearTimeout(undoTimer);undoTimer=setTimeout(function(){$('#toast').classList.remove('show');lastUndo=null},5000);
}
$('#undoBtn').addEventListener('click',function(){
  if(!lastUndo)return;var u=lastUndo;
  var i=state.chores.findIndex(function(x){return x.id===u.chore.id});
  if(i>=0)state.chores[i]=u.chore;else state.chores.push(u.chore);
  state.stats=u.stats;state.log=state.log.filter(function(l){return l.id!==u.logId});
  lastUndo=null;$('#toast').classList.remove('show');save();busy.clear();renderAll();
});

/* ---------- alerts ---------- */
function updateTitle(){var n=$('#alerts').children.length;document.title=(n?'('+n+') ':'')+'Tick: chore planner'}
function dismissAlert(id){var e=document.querySelector('.alert[data-id="'+id+'"]');if(e){e.remove();updateTitle()}}
function showAlert(c,due){
  dismissAlert(c.id);sfxAlert();buzz([200,100,200]);
  var diff=Math.round((due-Date.now())/60000);
  var when=diff>1?'Starts in '+span(diff)+' at '+timeLabel(c):diff>=-1?'Due now at '+timeLabel(c):'Overdue by '+span(-diff)+', was '+timeLabel(c);
  var el=document.createElement('div');el.className='alert';el.dataset.id=c.id;
  el.innerHTML='<div class="a-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21a2 2 0 004 0"/></svg></div>'+
    '<div class="a-body"><strong>'+esc(c.title)+'</strong><span>'+esc(when)+'</span></div><button class="a-x" data-a="x" aria-label="Dismiss">×</button>'+
    '<div class="a-act"><button data-a="done">Done</button><button data-a="snooze">Snooze 10 min</button></div>';
  $('#alerts').appendChild(el);updateTitle();
}
$('#alerts').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var el=b.closest('.alert'),id=el.dataset.id,a=b.dataset.a;
  if(a==='done'){complete(id,b)}
  else{if(a==='snooze'){var c=state.chores.find(function(x){return x.id===id});if(c){c.snoozeUntil=Date.now()+600000;save()}}el.remove();updateTitle()}
});
function checkAlerts(){
  var now=Date.now(),changed=false;
  state.chores.forEach(function(c){
    var due=dt(c).getTime(),key=c.due+'T'+c.time,fire=false;
    if(c.snoozeUntil){if(now>=c.snoozeUntil){fire=true;c.snoozeUntil=null}}
    else if(c.alertedFor!==key&&now>=due-(c.remind||0)*60000)fire=true;
    if(fire){c.alertedFor=key;changed=true;showAlert(c,due)}
  });
  if(changed)save();
}

/* ---------- sheet ---------- */
var editing=null,mode='once',delArmed=false;
function setMode(m){mode=m;$('#mOnce').setAttribute('aria-pressed',m==='once');$('#mRepeat').setAttribute('aria-pressed',m==='repeat');$('#everyRow').hidden=m!=='repeat'}
function openSheet(id,prefill){
  editing=id||null;delArmed=false;$('#err').textContent='';
  var c=id?state.chores.find(function(x){return x.id===id}):null;
  $('#sheetTitle').textContent=c?'Edit chore':'New chore';
  $('#delBtn').hidden=!c;$('#delBtn').textContent='Delete';
  if(c){$('#fTitle').value=c.title;$('#fDate').value=c.due;$('#fTime').value=c.time;$('#fRemind').value=String(c.remind);
    setMode(c.repeat?'repeat':'once');$('#fEvery').value=c.repeat?c.repeat.every:1;$('#fUnit').value=c.repeat?c.repeat.unit:'days'}
  else{var d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);
    $('#fTitle').value=prefill||'';$('#fDate').value=iso(d);$('#fTime').value=pad(d.getHours())+':00';$('#fRemind').value='10';setMode('once');$('#fEvery').value=1;$('#fUnit').value='days'}
  $('#wrap').classList.add('open');
  setTimeout(function(){$('#fTitle').focus()},60);
}
function closeSheet(){$('#wrap').classList.remove('open');$('#sheet').style.transform='';$('#scrim').style.opacity=''}
/* drag the handle/title down to dismiss */
(function(){
  var sh=$('#sheet'),sc=$('#scrim'),y0=0,dy=0,t0=0,drag=false,pid=null;
  function end(e){
    if(!drag)return;drag=false;sh.classList.remove('dragging');
    var fast=dy/Math.max(1,Date.now()-t0)>0.6;
    if(dy>110||(fast&&dy>30)){
      sh.style.transform='translateY(100%)';sc.style.opacity='0';
      setTimeout(closeSheet,reduced?0:300);
    }else{sh.style.transform='';sc.style.opacity=''}
  }
  $('#grab').addEventListener('pointerdown',function(e){
    drag=true;pid=e.pointerId;y0=e.clientY;dy=0;t0=Date.now();sh.classList.add('dragging');
    try{this.setPointerCapture(pid)}catch(x){}
  });
  $('#grab').addEventListener('pointermove',function(e){
    if(!drag)return;dy=Math.max(0,e.clientY-y0);
    sh.style.transform='translateY('+dy+'px)';sc.style.opacity=String(Math.max(0,1-dy/sh.offsetHeight));
  });
  $('#grab').addEventListener('pointerup',end);
  $('#grab').addEventListener('pointercancel',end);
})();
function saveSheet(){
  var title=$('#fTitle').value.trim(),date=$('#fDate').value,time=$('#fTime').value,err=$('#err');
  function bad(m){err.textContent=m;var s=$('#sheet');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
  if(!title)return bad('Give the chore a name.');
  if(!date||!time)return bad('Pick a date and a time.');
  var rep=mode==='repeat'?{every:Math.max(1,Math.min(99,parseInt($('#fEvery').value,10)||1)),unit:$('#fUnit').value}:null;
  var remind=parseInt($('#fRemind').value,10)||0;
  var c=editing?state.chores.find(function(x){return x.id===editing}):null;
  if(!c){c={id:uid(),created:Date.now()};state.chores.push(c)}
  c.title=title;c.due=date;c.time=time;c.repeat=rep;c.remind=remind;c.anchorDay=parse(date).getDate();c.snoozeUntil=null;
  var key=date+'T'+time;c.alertedFor=(Date.now()>=dt(c).getTime()-remind*60000)?key:null;
  save();closeSheet();
  if(tab==='done')tab='today',syncTabs();
  renderAll();
}
function syncTabs(){document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab)})}

$('#fab').addEventListener('click',function(){openSheet()});
$('#scrim').addEventListener('click',closeSheet);
$('#saveBtn').addEventListener('click',saveSheet);
$('#fTitle').addEventListener('keydown',function(e){if(e.key==='Enter')saveSheet()});
addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
$('#mOnce').addEventListener('click',function(){setMode('once')});
$('#mRepeat').addEventListener('click',function(){setMode('repeat')});
$('#qToday').addEventListener('click',function(){$('#fDate').value=todayISO()});
$('#qTomorrow').addEventListener('click',function(){var d=new Date();d.setDate(d.getDate()+1);$('#fDate').value=iso(d)});
$('#delBtn').addEventListener('click',function(){
  if(!delArmed){delArmed=true;this.textContent='Tap to confirm';return}
  state.chores=state.chores.filter(function(x){return x.id!==editing});dismissAlert(editing);save();closeSheet();renderAll();
});
$('#soundBtn').addEventListener('click',function(){state.sound=!state.sound;save();renderHeader();if(state.sound)sfxCheck(0)});
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.tab;syncTabs();renderList()})});
$('#list').addEventListener('click',function(e){
  var rm=e.target.closest('[data-rm]');
  if(rm){
    if(!rm.classList.contains('armed')){rm.classList.add('armed');rm.textContent='Remove?';return}
    var i=state.log.findIndex(function(l){return l.id===rm.dataset.rm});
    if(i>=0){state.stats.points=Math.max(0,state.stats.points-state.log[i].pts);state.log.splice(i,1);save();renderAll()}
    return;
  }
  var s=e.target.closest('[data-sugg]');if(s){openSheet(null,s.dataset.sugg);return}
  var li=e.target.closest('.item');if(!li)return;
  var chk=e.target.closest('.check');
  if(chk){complete(li.dataset.id,chk);return}
  if(!busy.has(li.dataset.id)&&(e.target.closest('.body')||e.target.closest('.edit')))openSheet(li.dataset.id);
});

/* ---------- boot ---------- */
renderAll();checkAlerts();
setInterval(function(){
  checkAlerts();
  if(!busy.size&&!$('#wrap').classList.contains('open'))renderAll();
},15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkAlerts();if(!busy.size)renderAll()}});
/* ---------- orientation ---------- */
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(function(){})}catch(e){}

/* ---------- offline support ---------- */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
