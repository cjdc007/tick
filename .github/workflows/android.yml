name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, sw.js, manifest.webmanifest, icons/**, android/**, capacitor.config.json, package*.json, scripts/**]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true only when the Play signing secrets are configured (see README.txt)
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run check
      - run: npm run build:web && npx cap sync android
      - name: Build debug APK (installs directly on a phone)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tick-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release AAB (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tick.keystore"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/tick.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: tick-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
